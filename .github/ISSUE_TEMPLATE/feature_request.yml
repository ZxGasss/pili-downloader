name: Feature request
description: Suggest a focused product or developer improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow problem rather than only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Permissions and compatibility
      description: Explain how account permissions, low-memory mode, recovery, and existing data are affected.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not bypass DRM, paid access, or regional restrictions.
          required: true
